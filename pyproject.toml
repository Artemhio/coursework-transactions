[tool.poetry]
name = "coursework-transactions"
version = "0.1.0"
description = ""
authors = ["Artem <artemiy9999@gmail.com>"]
readme = "README.md"

packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
pandas = "^2.3.3"
openpyxl = "^3.1.5"
python-dotenv = "^1.2.1"
requests = "^2.32.5"


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.1"
flake8 = "^7.3.0"
black = "^25.11.0"
isort = "^7.0.0"
mypy = "^1.18.2"
pytest-cov = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.black]
line-length = 119
exclude = '''
/(
    \.git
    | \.venv
    | \.mypy_cache
    | \.pytest_cache
)/
'''

[tool.isort]
line_length = 119
profile = "black"

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_return_any = true
exclude = "(venv|\\.venv)"